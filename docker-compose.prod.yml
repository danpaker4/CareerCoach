# Production compose for the college VM (careercoach.cs.colman.ac.il).
# Deploy-only: this file and everything under deploy/ carry no application code changes.
#
# App ports bind to 127.0.0.1 only - host nginx is the sole public entrypoint.
# MongoDB runs on the VM host (port 21771); containers reach it via host.docker.internal.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Health checks use a plain TCP connect (main has no /health endpoints).

x-tcp-health: &tcp-health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 25s

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: careercoach-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks: [careercoach]

  minio:
    image: minio/minio:latest
    container_name: careercoach-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env next to this compose file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env next to this compose file}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [careercoach]

  minio-setup:
    image: minio/mc:latest
    container_name: careercoach-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-careercoach-uploads}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" --api S3v4 && mc mb -p local/\"$$MINIO_BUCKET\""]
    networks: [careercoach]

  # ---------- observability ----------

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: careercoach-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Served under /jaeger/ by host nginx (basic-auth protected).
      QUERY_BASE_PATH: /jaeger
      # Cap in-memory trace storage - this VM has ~4 GB RAM total.
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped
    networks: [careercoach]

  # contrib image: needed for the basicauth extension used by the Langfuse exporter.
  # Pipelines: every span -> Jaeger; spans tagged langfuse.export=true -> Langfuse Cloud.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: careercoach-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env next to this compose file}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env next to this compose file}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    depends_on:
      - jaeger
    volumes:
      - ./otel-collector-langfuse-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    networks: [careercoach]

  # ---------- LLM routing ----------

  # Tiny local model: last-resort fallback so chat still answers if the college
  # gateway and Gemini are both unreachable. Kept small on purpose (VM has ~4 GB RAM).
  ollama:
    image: ollama/ollama:latest
    container_name: careercoach-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "1m"       # unload the model quickly to release RAM
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    networks: [careercoach]

  ollama-init:
    image: ollama/ollama:latest
    container_name: careercoach-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5; ollama pull ${OLLAMA_LOCAL_MODEL:-llama3.2:1b}"]
    restart: "no"
    networks: [careercoach]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: careercoach-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env next to this compose file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COLLEGE_LLM_BASE_URL: ${COLLEGE_LLM_BASE_URL:-http://10.10.248.41}
      COLLEGE_LLM_AUTH_HEADER: ${COLLEGE_LLM_AUTH_HEADER:-}
      LOCAL_OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LOCAL_MODEL: ${OLLAMA_LOCAL_MODEL:-llama3.2:1b}
    volumes:
      - ./litellm-config.prod.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - ollama
    restart: unless-stopped
    networks: [careercoach]

  # ---------- application ----------

  users-service:
    build: ./users-service
    container_name: careercoach-users
    env_file: ./deploy/env/users-service.env
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *tcp-health
    restart: unless-stopped
    networks: [careercoach]

  chat-service:
    build: ./chat-service
    container_name: careercoach-chat
    env_file: ./deploy/env/chat-service.env
    ports:
      - "127.0.0.1:3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *tcp-health
    restart: unless-stopped
    networks: [careercoach]

  chat-worker:
    build: ./chat-service
    container_name: careercoach-chat-worker
    command: ["node", "dist/chat-flow/api/worker/chat.worker.js"]
    env_file: ./deploy/env/chat-service.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [careercoach]

  job-service:
    build: ./job-service
    container_name: careercoach-job
    env_file: ./deploy/env/job-service.env
    ports:
      - "127.0.0.1:3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *tcp-health
    restart: unless-stopped
    networks: [careercoach]

  evaluation-service:
    build: ./evaluation-service
    container_name: careercoach-evaluation
    env_file: ./deploy/env/evaluation-service.env
    ports:
      - "127.0.0.1:3004:3004"
    volumes:
      # Promptfoo runs as a child process from the evaluation service; the package
      # lives outside this service's build context, so mount it (needs node_modules
      # installed on the host: see deploy/README.md).
      - ./evals/promptfoo:/evals/promptfoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3004,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *tcp-health
    restart: unless-stopped
    networks: [careercoach]

  # Promptfoo results viewer - the management page embeds it in an iframe.
  # Shares the same package (and its results DB) as the evaluation service.
  promptfoo-view:
    image: node:22
    container_name: careercoach-promptfoo-view
    working_dir: /evals/promptfoo
    # Use the promptfoo already installed in the mounted package. Running it via
    # `npx promptfoo@latest` re-downloads ~3 GB into the container layer on every start.
    command: ["./node_modules/.bin/promptfoo", "view", "--yes", "--port", "15500"]
    environment:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    volumes:
      - ./evals/promptfoo:/evals/promptfoo
      - promptfoo_home:/root/.promptfoo
    ports:
      - "127.0.0.1:15500:15500"
    restart: unless-stopped
    networks: [careercoach]

  roadmap-service:
    build: ./roadmap-service
    container_name: careercoach-roadmap
    env_file: ./deploy/env/roadmap-service.env
    ports:
      - "127.0.0.1:3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3005,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *tcp-health
    restart: unless-stopped
    networks: [careercoach]

networks:
  careercoach:
    driver: bridge

volumes:
  rabbitmq_data:
  minio_data:
  ollama_data:
  promptfoo_home:

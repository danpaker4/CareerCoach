extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter/jaeger:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  memory_limiter/langfuse:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - 'attributes["langfuse.export"] != true'
  batch/jaeger:
  batch/langfuse:
    send_batch_size: 256
    timeout: 5s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_BASE_URL}/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces/jaeger:
      receivers: [otlp]
      processors: [memory_limiter/jaeger, batch/jaeger]
      exporters: [otlp_grpc/jaeger]
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter/langfuse, filter/langfuse, batch/langfuse]
      exporters: [otlp_http/langfuse]

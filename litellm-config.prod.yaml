# LiteLLM routing for the college VM. Deploy config only - no application code depends on it.
# chat-service talks to this proxy (LITELLM_BASE_URL); routing/fallbacks live here.
#
# Chain: local Ollama (fast, no limits) -> college gateway (higher quality) -> Gemini (cloud).
#
# The college gateway sits behind nginx HTTP Basic Auth and only answers on its IP vhost
# (Host: llm.cs.colman.ac.il returns 403), so COLLEGE_LLM_BASE_URL must be the raw IP.
# Credentials go in an explicit header - LiteLLM rejects userinfo embedded in the URL
# ("Cannot combine AUTHORIZATION header with credentials encoded in URL").
# COLLEGE_LLM_AUTH_HEADER = "Basic " + base64("user:password")

model_list:
  # Primary: the tiny model running next to the app - no network hop, no rate limit.
  - model_name: chat-default
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: os.environ/LOCAL_OLLAMA_BASE_URL

  - model_name: chat-college
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: os.environ/COLLEGE_LLM_BASE_URL
      extra_headers:
        Authorization: os.environ/COLLEGE_LLM_AUTH_HEADER

  # gemini-2.5-flash is no longer served to new API projects; the -latest alias
  # always resolves to a model the project is allowed to call.
  - model_name: chat-gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  # Requested chain: local Ollama -> college gateway -> Gemini.
  fallbacks:
    - chat-default:
        - chat-college
        - chat-gemini
    - chat-college:
        - chat-gemini

litellm_settings:
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
